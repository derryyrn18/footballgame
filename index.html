<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Match 3D - Football</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#topbar {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  background: rgba(7, 13, 30, .94);
  border: 1px solid #ffffff26;
  border-radius: 9px;
  overflow: hidden;
  box-shadow: 0 8px 30px #0008;
  font-weight: 900;
  white-space: nowrap;
}

.team {
  padding: 12px 17px;
  font-size: 17px;
}

.blue { background: #176bfa; }
.red { background: #df302f; }

.score {
  min-width: 34px;
  padding: 12px 8px;
  text-align: center;
  font-size: 21px;
}

#clock {
  background: #fff;
  color: #10182a;
  min-width: 66px;
  padding: 13px 9px;
  text-align: center;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(#03081733, #0308179c);
  padding: 20px;
}

#overlay.hidden { display: none; }

#overlay h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 90px);
  font-weight: 1000;
  font-style: italic;
  text-transform: uppercase;
  letter-spacing: -3px;
  text-shadow: 0 5px 30px #000;
}

#overlay p {
  font-size: clamp(14px, 2vw, 19px);
  line-height: 1.6;
  color: #d9e4ff;
}

#start {
  padding: 14px 35px;
  border: 0;
  border-radius: 5px;
  background: #ffd447;
  color: #10172a;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}

#start:hover { background: white; }

#help {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 95%;
  padding: 10px 15px;
  background: #050a18c9;
  border: 1px solid #ffffff20;
  border-radius: 7px;
  color: #e5eaff;
  font-size: 12px;
  text-align: center;
}

#status {
  position: absolute;
  top: 83px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  text-shadow: 0 2px 8px #000;
  white-space: nowrap;
}

@media(max-width: 600px) {
  #topbar { top: 8px; }
  .team { padding: 9px; font-size: 13px; }
  .score { padding: 9px 5px; font-size: 17px; }
  #clock { min-width: 49px; padding: 10px 5px; }
  #help { font-size: 10px; bottom: 5px; }
}
</style>
</head>

<body>
<div id="game">

  <div id="topbar">
    <span class="team blue">BLUE FC</span>
    <span class="score" id="scoreA">0</span>
    <span id="clock">00:00</span>
    <span class="score" id="scoreB">0</span>
    <span class="team red">RED FC</span>
  </div>

  <div id="status">3D FOOTBALL · NIGHT MATCH</div>

  <div id="overlay">
    <h1 id="title">Night Match</h1>
    <p id="description">
      3D FIVE-A-SIDE FOOTBALL<br>
      Control your team and score goals.
    </p>
    <button id="start">KICK OFF</button>
  </div>

  <div id="help">
    WASD / Arrows: Move &nbsp;|&nbsp;
    SHIFT: Sprint &nbsp;|&nbsp;
    Hold SPACE: Shoot &nbsp;|&nbsp;
    F: Pass &nbsp;|&nbsp;
    ENTER: Start / Restart
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// ======================================
// NIGHT MATCH 3D - GAME CONFIGURATION
// ======================================

const FIELD_X = 100;
const FIELD_Z = 60;
const HALF_X = FIELD_X / 2;
const HALF_Z = FIELD_Z / 2;
const GOAL_HALF = 7.5;
const PLAYER_R = 1.25;
const BALL_R = 0.65;
const MATCH_SECONDS = 180;

const $ = id => document.getElementById(id);
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

let scene, camera, renderer, clock3;
let ballMesh, ballShadow;
let players = [];
let ball;
let controlled;
let score = [0, 0];
let elapsed = 0;
let gameState = "menu";
let stateTimer = 0;
let charging = false;
let charge = 0;
let lastTime = 0;
let goalScored = false;

const keys = {};

const TEAMS = [
  {
    name: "BLUE FC",
    color: 0x1671ff,
    dark: 0x103b99,
    shorts: 0x101e42,
    sock: 0xffffff,
    keeper: 0xffd947
  },
  {
    name: "RED FC",
    color: 0xf23c43,
    dark: 0x991c25,
    shorts: 0x252525,
    sock: 0xffffff,
    keeper: 0x49edb2
  }
];

const FORMATION = [
  [-43, 0],
  [-29, -16],
  [-29, 16],
  [-12, -9],
  [-12, 9]
];

const mat = (color, roughness = 0.8, metalness = 0) =>
  new THREE.MeshStandardMaterial({
    color, roughness, metalness
  });

const materials = {
  grass1: mat(0x247b37),
  grass2: mat(0x2b873d),
  line: mat(0xf1f5ed),
  white: mat(0xffffff),
  black: mat(0x171a20),
  skin: mat(0xb98059),
  hair: mat(0x272027),
  stand: mat(0x131b32),
  seat1: mat(0x35415a),
  seat2: mat(0x24304a),
  goal: mat(0xe9efff, 0.35, 0.3)
};

// ======================================
// SCENE AND CAMERA
// ======================================

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050b19);
  scene.fog = new THREE.Fog(0x050b19, 110, 230);

  camera = new THREE.PerspectiveCamera(
    43, innerWidth / innerHeight, 0.1, 400
  );
  camera.position.set(0, 78, 105);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  $("game").prepend(renderer.domElement);

  clock3 = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xc7ddff, 0x18351d, 2));

  const mainLight = new THREE.DirectionalLight(0xfff3dc, 3);
  mainLight.position.set(-25, 65, 35);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(2048, 2048);
  mainLight.shadow.camera.left = -75;
  mainLight.shadow.camera.right = 75;
  mainLight.shadow.camera.top = 75;
  mainLight.shadow.camera.bottom = -75;
  mainLight.shadow.normalBias = 0.035;
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0x7daaff, 1.3);
  fillLight.position.set(35, 35, -35);
  scene.add(fillLight);

  createStadium();
  createPitch();
  createGoals();
  createBall();
  createTeams();
  resetPositions();

  addEventListener("resize", onResize);

  addEventListener("keydown", e => {
    if ([
      "ArrowUp", "ArrowDown", "ArrowLeft",
      "ArrowRight", "Space"
    ].includes(e.code)) e.preventDefault();

    if (!e.repeat) {
      keys[e.code] = true;

      if (e.code === "Enter") {
        if (gameState === "menu" || gameState === "end") {
          startMatch();
        }
      }

      if (e.code === "Space" && gameState === "play") {
        charging = true;
        charge = 0;
      }

      if (e.code === "KeyF") passBall();
    }
  });

  addEventListener("keyup", e => {
    keys[e.code] = false;

    if (e.code === "Space" && charging) {
      charging = false;
      shootBall();
      charge = 0;
    }
  });

  $("start").addEventListener("click", () => {
    if (gameState === "menu" || gameState === "end") {
      startMatch();
    } else {
      hideOverlay();
    }
  });

  showOverlay(
    "Night Match",
    "3D FIVE-A-SIDE FOOTBALL<br>WASD to move · Hold SPACE to shoot",
    "KICK OFF"
  );

  lastTime = performance.now();
  requestAnimationFrame(loop);
}

// ======================================
// STADIUM
// ======================================

function createStadium() {
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(250, 200),
    mat(0x10182a)
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.5;
  ground.receiveShadow = true;
  scene.add(ground);

  // Four banks of stadium stands
  for (const side of [-1, 1]) {
    const stand = new THREE.Mesh(
      new THREE.BoxGeometry(112, 12, 12),
      materials.stand
    );
    stand.position.set(0, 4, side * 39);
    stand.castShadow = true;
    scene.add(stand);

    const endStand = new THREE.Mesh(
      new THREE.BoxGeometry(12, 12, 80),
      materials.stand
    );
    endStand.position.set(side * 57, 4, 0);
    scene.add(endStand);
  }

  // Colored crowd seats, represented by individual blocks
  const seatColors = [0x334362, 0x253858, 0x6a3544, 0x53637c];

  for (let row = 0; row < 4; row++) {
    for (let i = 0; i < 64; i++) {
      const x = -54 + i * 1.72;

      for (const side of [-1, 1]) {
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(1.15, 0.8, 0.8),
          mat(seatColors[(i * 7 + row * 11) % seatColors.length])
        );

        seat.position.set(
          x, 3 + row * 2.1, side * (34 + row * 1.2)
        );

        scene.add(seat);
      }
    }

    for (let i = 0; i < 7; i++) {
      const z = -28 + i * 9;

      for (const side of [-1, 1]) {
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(0.8, 0.8, 1.15),
          mat(seatColors[(i * 5 + row * 3) % seatColors.length])
        );

        seat.position.set(side * (52 + row * 1.4),
          3 + row * 2.1, z);
        scene.add(seat);
      }
    }
  }

  // Floodlight towers and lamps
  for (const x of [-56, 56]) {
    for (const z of [-34, 34]) {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.5, 24, 8),
        mat(0x657087, 0.4, 0.6)
      );
      pole.position.set(x, 12, z);
      scene.add(pole);

      const lamp = new THREE.Mesh(
        new THREE.BoxGeometry(5, 1, 1.4),
        new THREE.MeshBasicMaterial({ color: 0xfff4d1 })
      );
      lamp.position.set(x, 24, z);
      scene.add(lamp);

      const light = new THREE.PointLight(0xfff0ce, 180, 70, 2);
      light.position.set(x, 22, z);
      scene.add(light);
    }
  }
}

// ======================================
// PITCH AND MARKINGS
// ======================================

function createPitch() {
  const pitch = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD_X, FIELD_Z),
    materials.grass1
  );

  pitch.rotation.x = -Math.PI / 2;
  pitch.receiveShadow = true;
  scene.add(pitch);

  // Alternating grass stripes
  for (let i = 0; i < 10; i++) {
    const stripe = new THREE.Mesh(
      new THREE.PlaneGeometry(10, FIELD_Z),
      mat(i % 2 ? 0x27823b : 0x2c8b40)
    );

    stripe.rotation.x = -Math.PI / 2;
    stripe.position.set(-45 + i * 10, 0.012, 0);
    stripe.receiveShadow = true;
    scene.add(stripe);
  }

  function line(x1, z1, x2, z2, width = 0.12) {
    const dx = x2 - x1;
    const dz = z2 - z1;
    const length = Math.hypot(dx, dz);

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(length, 0.035, width),
      materials.line
    );

    mesh.position.set((x1 + x2) / 2, 0.045, (z1 + z2) / 2);
    mesh.rotation.y = -Math.atan2(dz, dx);
    scene.add(mesh);
  }

  line(-50, -30, 50, -30);
  line(-50, 30, 50, 30);
  line(-50, -30, -50, 30);
  line(50, -30, 50, 30);
  line(0, -30, 0, 30);

  const circle = new THREE.Mesh(
    new THREE.TorusGeometry(8, 0.09, 5, 80),
    materials.line
  );
  circle.rotation.x = Math.PI / 2;
  circle.position.y = 0.07;
  scene.add(circle);

  const spot = new THREE.Mesh(
    new THREE.CircleGeometry(0.22, 20),
    materials.line
  );
  spot.rotation.x = -Math.PI / 2;
  spot.position.y = 0.08;
  scene.add(spot);

  for (const side of [-1, 1]) {
    const x = side * 50;

    line(x, -17, x - side * 16, -17);
    line(x - side * 16, -17, x - side * 16, 17);
    line(x - side * 16, 17, x, 17);

    line(x, -9, x - side * 6, -9);
    line(x - side * 6, -9, x - side * 6, 9);
    line(x - side * 6, 9, x, 9);

    const penalty = new THREE.Mesh(
      new THREE.CircleGeometry(0.2, 16),
      materials.line
    );
    penalty.rotation.x = -Math.PI / 2;
    penalty.position.set(x - side * 11, 0.08, 0);
    scene.add(penalty);
  }
}

// ======================================
// GOALS
// ======================================

function createGoals() {
  for (const side of [-1, 1]) {
    const x = side * 50;
    const depth = 4;

    const frame = new THREE.Group();
    const postMaterial = materials.goal;

    function bar(w, h, d, px, py, pz) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        postMaterial
      );
      m.position.set(px, py, pz);
      m.castShadow = true;
      frame.add(m);
    }

    bar(0.35, 5, 0.35, 0, 2.5, -GOAL_HALF);
    bar(0.35, 5, 0.35, 0, 2.5, GOAL_HALF);
    bar(0.35, 0.35, GOAL_HALF * 2, 0, 5, 0);

    for (const zSide of [-1, 1]) {
      bar(depth, 0.12, 0.12, side * depth / 2, 0.2,
        zSide * GOAL_HALF);
    }

    bar(depth, 0.12, 0.12, side * depth, 2.5, 0);

    // Goal net
    const netMat = new THREE.LineBasicMaterial({
      color: 0xdbe7ff,
      transparent: true,
      opacity: 0.42
    });

    for (let z = -GOAL_HALF; z <= GOAL_HALF; z += 1.5) {
      const points = [
        new THREE.Vector3(0, 0.2, z),
        new THREE.Vector3(side * depth, 0.2, z),
        new THREE.Vector3(side * depth, 5, z)
      ];

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      frame.add(new THREE.Line(geometry, netMat));
    }

    for (let y = 1; y < 5; y++) {
      const geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, y, -GOAL_HALF),
        new THREE.Vector3(side * depth, y, -GOAL_HALF),
        new THREE.Vector3(side * depth, y, GOAL_HALF),
        new THREE.Vector3(0, y, GOAL_HALF)
      ]);

      frame.add(new THREE.Line(geometry, netMat));
    }

    frame.position.x = x;
    scene.add(frame);
  }
}

// ======================================
// 3D PLAYER MODELS
// ======================================

function createPlayer(team, index) {
  const kit = TEAMS[team];
  const root = new THREE.Group();

  const jersey = mat(kit.color);
  const shortsMat = mat(kit.shorts);
  const bootMat = mat(0x12151b);
  const skinMat = materials.skin;
  const hairMat = materials.hair;
  const sockMat = mat(kit.sock);

  function capsule(radius, length, material, x, y, z) {
    const mesh = new THREE.Mesh(
      new THREE.CapsuleGeometry(radius, length, 4, 8),
      material
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    root.add(mesh);
    return mesh;
  }

  // Shorts
  const shorts = new THREE.Mesh(
    new THREE.BoxGeometry(1.05, 0.48, 0.66),
    shortsMat
  );
  shorts.position.y = 1.08;
  shorts.castShadow = true;
  root.add(shorts);

  // Torso
  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.48, 0.65, 5, 10),
    jersey
  );
  body.position.y = 1.85;
  body.castShadow = true;
  root.add(body);

  // Shirt details
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.11, 1.15, 0.85),
    mat(0xffffff)
  );
  stripe.position.set(0, 1.83, 0);
  stripe.castShadow = true;
  root.add(stripe);

  // Neck and head
  capsule(0.17, 0.15, skinMat, 0, 2.43, 0);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 16, 12),
    skinMat
  );
  head.position.y = 2.78;
  head.scale.set(0.9, 1.1, 0.95);
  head.castShadow = true;
  root.add(head);

  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.345, 16, 8, 0, Math.PI * 2, 0, 1.2),
    hairMat
  );
  hair.position.y = 2.88;
  hair.castShadow = true;
  root.add(hair);

  // Arms and legs use pivots for running animations
  const limbs = [];

  for (const side of [-1, 1]) {
    const armPivot = new THREE.Group();
    armPivot.position.set(side * 0.53, 2.13, 0);
    root.add(armPivot);

    const arm = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.13, 0.62, 4, 8),
      jersey
    );
    arm.position.y = -0.38;
    arm.rotation.z = -side * 0.13;
    arm.castShadow = true;
    armPivot.add(arm);

    const hand = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 8, 8),
      skinMat
    );
    hand.position.y = -0.79;
    armPivot.add(hand);

    const legPivot = new THREE.Group();
    legPivot.position.set(side * 0.28, 1.0, 0);
    root.add(legPivot);

    const leg = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.17, 0.55, 4, 8),
      sockMat
    );
    leg.position.y = -0.36;
    leg.castShadow = true;
    legPivot.add(leg);

    const boot = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.17, 0.55),
      bootMat
    );
    boot.position.set(0, -0.72, 0.13);
    boot.castShadow = true;
    legPivot.add(boot);

    limbs.push({ armPivot, legPivot, side });
  }

  // Player number on the back-facing side
  const numberCanvas = document.createElement("canvas");
  numberCanvas.width = 128;
  numberCanvas.height = 128;

  const ctx = numberCanvas.getContext("2d");
  ctx.clearRect(0, 0, 128, 128);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 76px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String([1, 4, 8, 10, 9][index]), 64, 65);

  const numberTexture = new THREE.CanvasTexture(numberCanvas);
  numberTexture.colorSpace = THREE.SRGBColorSpace;

  const number = new THREE.Mesh(
    new THREE.PlaneGeometry(0.48, 0.48),
    new THREE.MeshBasicMaterial({
      map: numberTexture,
      transparent: true,
      side: THREE.DoubleSide
    })
  );
  number.position.set(0, 1.85, -0.49);
  root.add(number);

  // Keeper gloves
  if (index === 0) {
    jersey.color.setHex(kit.keeper);
    stripe.visible = false;
    shortsMat.color.setHex(0x20242b);
  }

  // Ground shadow
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.2, 20),
    new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.25,
      depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.025;
  root.add(shadow);

  scene.add(root);

  return {
    team,
    index,
    root,
    limbs,
    shadow,
    x: 0,
    z: 0,
    vx: 0,
    vz: 0,
    fx: team === 0 ? 1 : -1,
    fz: 0,
    speed: index === 0 ? 12 : 14,
    keeper: index === 0,
    cooldown: 0,
    think: 0,
    phase: Math.random() * 6,
    homeX: 0,
    homeZ: 0,
    isChaser: false
  };
}

// ======================================
// BALL
// ======================================

function createBall() {
  ballMesh = new THREE.Group();

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 24, 18),
    mat(0xf5f5f5, 0.38)
  );
  sphere.castShadow = true;
  ballMesh.add(sphere);

  const blackMat = mat(0x151b28, 0.6);

  // Dark panels on the ball
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5;
    const panel = new THREE.Mesh(
      new THREE.CircleGeometry(0.19, 5),
      blackMat
    );

    panel.position.set(
      Math.cos(a) * 0.3,
      Math.sin(a) * 0.3,
      0.56
    );
    ballMesh.add(panel);
  }

  scene.add(ballMesh);

  ballShadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.0, 24),
    new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.3,
      depthWrite: false
    })
  );
  ballShadow.rotation.x = -Math.PI / 2;
  ballShadow.position.y = 0.03;
  scene.add(ballShadow);

  ball = {
    x: 0, z: 0, y: BALL_R,
    vx: 0, vz: 0, vy: 0,
    spin: 0,
    owner: null,
    lastTeam: 0
  };
}

function createTeams() {
  players = [];

  for (let team = 0; team < 2; team++) {
    for (let i = 0; i < 5; i++) {
      players.push(createPlayer(team, i));
    }
  }

  controlled = players.find(p => p.team === 0 && p.index === 4);
}

// ======================================
// RESET AND UI
// ======================================

function resetPositions(kickTeam = 0) {
  for (const p of players) {
    const f = FORMATION[p.index];

    p.x = p.team === 0 ? f[0] : -f[0];
    p.z = p.team === 0 ? f[1] : f[1];
    p.vx = 0;
    p.vz = 0;
    p.cooldown = 0;
    p.think = 0;
    p.root.rotation.y = p.team === 0 ? Math.PI / 2 : -Math.PI / 2;
    p.homeX = p.x;
    p.homeZ = p.z;
  }

  ball.x = 0;
  ball.z = 0;
  ball.y = BALL_R;
  ball.vx = 0;
  ball.vz = 0;
  ball.vy = 0;
  ball.owner = null;
  ball.lastTeam = kickTeam;

  const kicker = players.find(
    p => p.team === kickTeam && p.index === 4
  );
  kicker.x = kickTeam === 0 ? -2 : 2;
  kicker.z = 0;

  controlled = players.find(p => p.team === 0 && p.index === 4);

  updateTransforms();
}

function updateTransforms() {
  for (const p of players) {
    p.root.position.set(p.x, 0, p.z);
  }

  ballMesh.position.set(ball.x, ball.y, ball.z);
  ballShadow.position.set(ball.x, 0.03, ball.z);
}

function showOverlay(title, description, button) {
  $("title").textContent = title;
  $("description").innerHTML = description;
  $("start").textContent = button;
  $("overlay").classList.remove("hidden");
}

function hideOverlay() {
  $("overlay").classList.add("hidden");
}

function updateHUD() {
  $("scoreA").textContent = score[0];
  $("scoreB").textContent = score[1];

  const seconds = Math.floor(
    Math.min(elapsed, MATCH_SECONDS) / MATCH_SECONDS * 90
  );

  $("clock").textContent =
    String(Math.floor(seconds / 60)).padStart(2, "0") +
    ":" +
    String(seconds % 60).padStart(2, "0");
}

function startMatch() {
  score = [0, 0];
  elapsed = 0;
  charging = false;
  charge = 0;
  resetPositions(0);
  gameState = "ready";
  stateTimer = 0;
  hideOverlay();
  updateHUD();
}

function scoreGoal(team) {
  if (gameState !== "play") return;

  score[team]++;
  gameState = "goal";
  stateTimer = 0;
  ball.owner = null;
  ball.vx = 0;
  ball.vz = 0;
  goalScored = true;

  updateHUD();

  showOverlay(
    "GOAL!",
    `${TEAMS[0].name} ${score[0]} - ${score[1]} ${TEAMS[1].name}`,
    "CONTINUE"
  );
}

// ======================================
// PLAYER CONTROL
// ======================================

function moveHuman(p, dt) {
  let ix =
    (keys.KeyD || keys.ArrowRight ? 1 : 0) -
    (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  let iz =
    (keys.KeyS || keys.ArrowDown ? 1 : 0) -
    (keys.KeyW || keys.ArrowUp ? 1 : 0);

  const mag = Math.hypot(ix, iz) || 1;
  ix /= mag;
  iz /= mag;

  const sprint = keys.ShiftLeft || keys.ShiftRight;
  const speed = sprint ? 19 : 14;
  const blend = Math.min(1, dt * 10);

  p.vx += (ix * speed - p.vx) * blend;
  p.vz += (iz * speed - p.vz) * blend;

  if (ix || iz) {
    p.fx = ix;
    p.fz = iz;
  }

  if (charging) {
    charge = Math.min(1, charge + dt / 1.1);
  }
}

function moveAI(p, dt) {
  const direction = p.team === 0 ? 1 : -1;
  const ownBall = ball.owner && ball.owner.team === p.team;

  let tx = p.homeX;
  let tz = p.homeZ;
  let speed = p.speed;

  if (p.keeper) {
    tx = p.team === 0 ? -46 : 46;
    tz = clamp(ball.z * 0.65, -GOAL_HALF + 1, GOAL_HALF - 1);

    if (Math.abs(ball.x - tx) < 8) {
      tz = clamp(ball.z, -GOAL_HALF, GOAL_HALF);
    }
  } else if (p.isChaser && !ownBall) {
    tx = ball.x;
    tz = ball.z;
    speed *= 1.1;
  } else {
    tx += clamp(ball.x * 0.22, -10, 10);
    tz += clamp(ball.z * 0.28, -9, 9);

    if (ownBall) tx += direction * 9;
  }

  if (ball.owner === p) {
    p.think += dt;

    const goalX = p.team === 0 ? 50 : -50;
    const nearGoal = Math.abs(goalX - p.x) < 29;

    tx = p.x + direction * 10;
    tz = p.z * 0.65;

    if (nearGoal && p.think > 0.7) {
      aiShoot(p);
      p.think = 0;
    } else if (p.think > 1.2 && Math.random() < 0.015) {
      aiPass(p);
      p.think = 0;
    }
  }

  const dx = tx - p.x;
  const dz = tz - p.z;
  const d = Math.hypot(dx, dz) || 1;
  const blend = Math.min(1, dt * 4);

  p.vx += (dx / d * speed - p.vx) * blend;
  p.vz += (dz / d * speed - p.vz) * blend;

  if (d > 1) {
    p.fx = dx / d;
    p.fz = dz / d;
  }
}

function chooseControlledPlayer() {
  let best = null;
  let distance = Infinity;

  for (const p of players) {
    if (p.team !== 0 || p.keeper) continue;

    const d = Math.hypot(p.x - ball.x, p.z - ball.z);

    if (d < distance) {
      distance = d;
      best = p;
    }
  }

  if (best) controlled = best;
}

// ======================================
// SHOOTING AND PASSING
// ======================================

function shootBall() {
  if (gameState !== "play" || !controlled) return;

  const p = controlled;
  const d = Math.hypot(ball.x - p.x, ball.z - p.z);

  if (d > 3.8) return;

  let dx = p.fx;
  let dz = p.fz;

  const goalX = p.team === 0 ? 50 : -50;
  const targetZ = clamp(ball.z, -GOAL_HALF + 1, GOAL_HALF - 1);

  const gx = goalX - ball.x;
  const gz = targetZ - ball.z;
  const gl = Math.hypot(gx, gz) || 1;

  const dot = dx * gx / gl + dz * gz / gl;

  if (dot > 0.2) {
    dx = dx * 0.65 + gx / gl * 0.35;
    dz = dz * 0.65 + gz / gl * 0.35;
  }

  const m = Math.hypot(dx, dz) || 1;
  const power = 19 + charge * 24;

  ball.x = p.x + dx / m * 2;
  ball.z = p.z + dz / m * 2;
  ball.vx = dx / m * power;
  ball.vz = dz / m * power;
  ball.vy = 2 + charge * 4;
  ball.owner = null;
  ball.lastTeam = p.team;
}

function passBall() {
  if (gameState !== "play" || !controlled) return;

  const p = controlled;

  if (Math.hypot(ball.x - p.x, ball.z - p.z) > 3.8) return;

  let best = null;
  let bestScore = -Infinity;

  for (const m of players) {
    if (m.team !== 0 || m === p || m.keeper) continue;

    const dx = m.x - p.x;
    const dz = m.z - p.z;
    const d = Math.hypot(dx, dz) || 1;
    const dot = (dx * p.fx + dz * p.fz) / d;

    if (dot < -0.2) continue;

    const s = dot * 15 - d * 0.12;

    if (s > bestScore) {
      best = m;
      bestScore = s;
    }
  }

  if (best) {
    const dx = best.x - ball.x;
    const dz = best.z - ball.z;
    const d = Math.hypot(dx, dz) || 1;

    ball.vx = dx / d * Math.min(23, 11 + d * 0.25);
    ball.vz = dz / d * Math.min(23, 11 + d * 0.25);
  } else {
    ball.vx = p.fx * 13;
    ball.vz = p.fz * 13;
  }

  ball.vy = 0.8;
  ball.owner = null;
  ball.lastTeam = p.team;
}

function aiShoot(p) {
  const goalX = p.team === 0 ? 50 : -50;
  const targetZ = (Math.random() - 0.5) * GOAL_HALF * 1.4;

  const dx = goalX - ball.x;
  const dz = targetZ - ball.z;
  const d = Math.hypot(dx, dz) || 1;

  ball.vx = dx / d * 27;
  ball.vz = dz / d * 27;
  ball.vy = 2.8;
  ball.owner = null;
  ball.lastTeam = p.team;
}

function aiPass(p) {
  let best = null;
  let bestD = Infinity;

  for (const m of players) {
    if (m.team !== p.team || m === p || m.keeper) continue;

    const d = Math.hypot(m.x - p.x, m.z - p.z);

    if (d < bestD && d > 4) {
      bestD = d;
      best = m;
    }
  }

  if (best) {
    const dx = best.x - ball.x;
    const dz = best.z - ball.z;
    const d = Math.hypot(dx, dz) || 1;

    ball.vx = dx / d * 17;
    ball.vz = dz / d * 17;
    ball.owner = null;
  }
}

// ======================================
// PHYSICS AND COLLISIONS
// ======================================

function updateBall(dt) {
  ball.x += ball.vx * dt;
  ball.z += ball.vz * dt;
  ball.y += ball.vy * dt;

  ball.vy -= 14 * dt;

  if (ball.y < BALL_R) {
    ball.y = BALL_R;
    ball.vy = Math.abs(ball.vy) * 0.48;

    if (Math.abs(ball.vy) < 1) ball.vy = 0;
  }

  const friction = Math.exp(-1.15 * dt);
  ball.vx *= friction;
  ball.vz *= friction;

  ball.spin += Math.hypot(ball.vx, ball.vz) * dt;

  // Ball collides with the sidelines
  if (Math.abs(ball.z) > HALF_Z - BALL_R) {
    ball.z = Math.sign(ball.z) * (HALF_Z - BALL_R);
    ball.vz *= -0.65;
  }

  // Goal scoring
  if (
    ball.x > HALF_X &&
    Math.abs(ball.z) < GOAL_HALF &&
    ball.y < 5
  ) {
    scoreGoal(0);
    return;
  }

  if (
    ball.x < -HALF_X &&
    Math.abs(ball.z) < GOAL_HALF &&
    ball.y < 5
  ) {
    scoreGoal(1);
    return;
  }

  // End line outside the goals
  if (Math.abs(ball.x) > HALF_X - BALL_R) {
    if (Math.abs(ball.z) > GOAL_HALF || ball.y > 5) {
      ball.x = Math.sign(ball.x) * (HALF_X - BALL_R);
      ball.vx *= -0.65;
    }
  }

  // Simple player contact, tackles, and goalkeeper saves
  for (const p of players) {
    const dx = ball.x - p.x;
    const dz = ball.z - p.z;
    const d = Math.hypot(dx, dz);

    if (d > PLAYER_R + BALL_R + 0.3) continue;

    if (p.keeper && ball.y < 3.5) {
      const side = p.team === 0 ? 1 : -1;

      ball.vx = side * (13 + Math.random() * 8);
      ball.vz = (Math.random() - 0.5) * 17;
      ball.vy = 2;
      ball.owner = null;
      continue;
    }

    if (ball.owner && ball.owner.team !== p.team) {
      if (Math.random() < 0.025) {
        ball.owner = null;
        ball.vx = p.fx * 8;
        ball.vz = p.fz * 8;
      }
      continue;
    }

    const m = d || 1;

    if (Math.hypot(ball.vx, ball.vz) > 21) {
      ball.vx *= 0.72;
      ball.vz *= 0.72;
      continue;
    }

    ball.x = p.x + dx / m * (PLAYER_R + BALL_R);
    ball.z = p.z + dz / m * (PLAYER_R + BALL_R);
    ball.vx = p.vx * 0.9;
    ball.vz = p.vz * 0.9;
    ball.owner = p;
    ball.lastTeam = p.team;
  }

  // Keep ball above pitch
  ballMesh.position.set(ball.x, ball.y, ball.z);
  ballMesh.rotation.set(ball.spin * 0.3, 0, ball.spin * 0.45);
  ballShadow.position.set(ball.x, 0.035, ball.z);

  const shadowScale = clamp(1.2 - (ball.y - BALL_R) * 0.08, 0.45, 1.2);
  ballShadow.scale.setScalar(shadowScale);
  ballShadow.material.opacity = clamp(0.32 - (ball.y - BALL_R) * 0.04, 0.08, 0.32);
}

function resolvePlayers() {
  for (let i = 0; i < players.length; i++) {
    const a = players[i];

    for (let j = i + 1; j < players.length; j++) {
      const b = players[j];
      const dx = b.x - a.x;
      const dz = b.z - a.z;
      const d = Math.hypot(dx, dz);

      if (d > 0 && d < PLAYER_R * 1.5) {
        const overlap = (PLAYER_R * 1.5 - d) * 0.5;
        a.x -= dx / d * overlap;
        a.z -= dz / d * overlap;
        b.x += dx / d * overlap;
        b.z += dz / d * overlap;
      }
    }
  }
}

// ======================================
// ANIMATION
// ======================================

function updatePlayers(dt) {
  chooseControlledPlayer();

  // Select one AI chaser per team
  for (const team of [0, 1]) {
    let closest = null;
    let distance = Infinity;

    for (const p of players) {
      p.isChaser = false;

      if (p.team !== team || p.keeper) continue;

      const d = Math.hypot(p.x - ball.x, p.z - ball.z);

      if (d < distance) {
        distance = d;
        closest = p;
      }
    }

    if (closest) closest.isChaser = true;
  }

  for (const p of players) {
    if (p === controlled) {
      moveHuman(p, dt);
    } else {
      moveAI(p, dt);
    }

    p.x += p.vx * dt;
    p.z += p.vz * dt;

    p.x = clamp(p.x, -HALF_X + 1.5, HALF_X - 1.5);
    p.z = clamp(p.z, -HALF_Z + 1.5, HALF_Z - 1.5);

    p.cooldown = Math.max(0, p.cooldown - dt);
    p.phase += Math.hypot(p.vx, p.vz) * dt * 0.8;

    const speed = Math.hypot(p.vx, p.vz);
    const running = Math.min(1, speed / 10);

    for (const limb of p.limbs) {
      const swing = Math.sin(p.phase) * 0.65 * running;
      limb.legPivot.rotation.x = limb.side * swing;
      limb.armPivot.rotation.x = -limb.side * swing * 0.8;
    }

    p.root.position.set(p.x, 0, p.z);

    if (speed > 0.4) {
      p.root.rotation.y = Math.atan2(p.vx, p.vz);
    }

    // Mark controlled player
    p.shadow.material.opacity = p === controlled ? 0.5 : 0.25;
    p.shadow.scale.setScalar(p === controlled ? 1.25 : 1);
  }

  resolvePlayers();
}

function updateCamera(dt) {
  const targetX = controlled ? controlled.x * 0.16 : 0;
  const targetZ = controlled ? controlled.z * 0.10 : 0;

  camera.position.x += (targetX - camera.position.x) * Math.min(1, dt);
  camera.position.z += (105 - camera.position.z) * Math.min(1, dt * 0.5);

  camera.lookAt(targetX, 0, targetZ);
}

// ======================================
// GAME LOOP
// ======================================

function update(dt) {
  if (gameState === "menu" || gameState === "end") return;

  stateTimer += dt;

  if (gameState === "ready") {
    if (stateTimer > 1.5) {
      gameState = "play";
      stateTimer = 0;
      hideOverlay();
    }
    return;
  }

  if (gameState === "goal") {
    if (stateTimer > 2.2) {
      if (elapsed >= MATCH_SECONDS) {
        finishMatch();
      } else {
        resetPositions(score[0] > score[1] ? 1 : 0);
        gameState = "ready";
        stateTimer = 0;
        hideOverlay();
      }
    }
    return;
  }

  elapsed += dt;

  if (elapsed >= MATCH_SECONDS) {
    elapsed = MATCH_SECONDS;
    updateHUD();
    finishMatch();
    return;
  }

  updatePlayers(dt);
  updateBall(dt);
  updateHUD();
  updateCamera(dt);
}

function finishMatch() {
  gameState = "end";
  charging = false;

  let result = "FULL TIME";

  if (score[0] > score[1]) result = "BLUE FC WINS!";
  if (score[1] > score[0]) result = "RED FC WINS!";
  if (score[0] === score[1]) result = "FULL TIME - DRAW";

  showOverlay(
    result,
    `FINAL SCORE<br>BLUE FC ${score[0]} - ${score[1]} RED FC`,
    "PLAY AGAIN"
  );
}

function onResize() {
  if (!renderer || !camera) return;

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
}

function loop(now) {
  requestAnimationFrame(loop);

  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;

  update(dt);
  renderer.render(scene, camera);
}

// ======================================
// START
// ======================================

init();
</script>
