<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Night Match 3D Football</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:white;font-family:Arial,sans-serif;overscroll-behavior:none;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#topbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;background:#070d1eee;border:1px solid #ffffff30;border-radius:8px;overflow:hidden;font-weight:900;white-space:nowrap;z-index:5}
.team{padding:10px 13px;font-size:15px}
.blue{background:#176bfa}.red{background:#df302f}
.score{min-width:30px;padding:10px 7px;text-align:center;font-size:20px}
#clock{background:white;color:#10182a;min-width:57px;padding:11px 7px;text-align:center}
#status{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:bold;text-shadow:0 2px 8px black;white-space:nowrap;z-index:5}
#overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#03081733,#030817c9);padding:20px;touch-action:auto}
#overlay.hidden{display:none}
#overlay h1{margin:0;font-size:clamp(40px,9vw,82px);font-weight:1000;font-style:italic;text-transform:uppercase;letter-spacing:-2px;text-shadow:0 5px 30px #000}
#overlay p{font-size:16px;line-height:1.6;color:#d9e4ff}
#start{padding:15px 34px;border:0;border-radius:5px;background:#ffd447;color:#10172a;font-size:18px;font-weight:900;min-height:48px;touch-action:manipulation}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;padding:9px 12px;background:#050a18d9;border:1px solid #ffffff20;border-radius:7px;color:#e5eaff;font-size:12px;text-align:center;z-index:5}
#mobileControls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;touch-action:none;user-select:none;-webkit-user-select:none}
#joystick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(25px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid #ffffff80;background:#101b31a8;box-shadow:inset 0 0 18px #ffffff12;pointer-events:auto;touch-action:none}
#joystickKnob{position:absolute;width:50px;height:50px;left:33px;top:33px;border-radius:50%;border:2px solid #ffffffd0;background:#dbe8ff88;box-shadow:0 3px 12px #0008;pointer-events:none}
.action{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid #ffffffb0;border-radius:50%;color:white;font-weight:900;text-align:center;text-shadow:0 2px 4px #0008;box-shadow:0 4px 14px #0007;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.action.pressed{transform:scale(.93);filter:brightness(1.3)}
#shootButton{width:76px;height:76px;right:max(20px,env(safe-area-inset-right));bottom:max(35px,env(safe-area-inset-bottom));background:#e53935e8;font-size:13px}
#passButton{width:58px;height:58px;right:max(104px,calc(env(safe-area-inset-right) + 104px));bottom:max(31px,env(safe-area-inset-bottom));background:#2378ede8;font-size:12px}
#sprintButton{width:58px;height:58px;right:max(28px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom) + 120px));background:#e9a51be8;color:#171717;font-size:10px}
@media(pointer:coarse),(max-width:800px){#mobileControls{display:block}#help{display:none}}
@media(max-width:600px){#topbar{top:max(7px,env(safe-area-inset-top))}.team{padding:9px 7px;font-size:12px}.score{padding:9px 5px;font-size:17px}#clock{min-width:48px;padding:10px 4px}#status{top:51px;font-size:10px}}
@media(max-height:430px) and (orientation:landscape){#joystick{width:92px;height:92px;bottom:12px}#joystickKnob{width:40px;height:40px;left:24px;top:24px}#shootButton{width:62px;height:62px;bottom:14px}#passButton{width:48px;height:48px;bottom:13px}#sprintButton{width:46px;height:46px;bottom:80px}}
</style>
</head>
<body>
<div id="game">
  <div id="topbar">
    <span class="team blue">BLUE FC</span><span class="score" id="scoreA">0</span>
    <span id="clock">00:00</span><span class="score" id="scoreB">0</span>
    <span class="team red">RED FC</span>
  </div>
  <div id="status">3D FOOTBALL · NIGHT MATCH</div>
  <div id="overlay">
    <h1 id="title">Night Match</h1>
    <p id="description">3D FIVE-A-SIDE FOOTBALL<br>Use the joystick to move.<br>Hold SHOOT to charge your kick.</p>
    <button id="start">KICK OFF</button>
  </div>
  <div id="help">WASD / Arrows: Move · Shift: Sprint · Hold Space: Shoot · F: Pass · Enter: Start</div>
  <div id="mobileControls">
    <div id="joystick" aria-label="Move player"><div id="joystickKnob"></div></div>
    <button id="sprintButton" class="action" type="button">SPRINT</button>
    <button id="passButton" class="action" type="button">PASS</button>
    <button id="shootButton" class="action" type="button">SHOOT</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FIELD_X=100,FIELD_Z=60,HALF_X=50,HALF_Z=30,GOAL_HALF=7.5,BALL_R=.65,PLAYER_R=1.25,MATCH_SECONDS=180;
const TEAMS=[
 {name:"BLUE FC",color:0x1671ff,shorts:0x101e42,keeper:0xffd947},
 {name:"RED FC",color:0xf23c43,shorts:0x252525,keeper:0x49edb2}
];
const FORMATION=[[-43,0],[-29,-16],[-29,16],[-12,-9],[-12,9]];
const material=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
let scene,camera,renderer,clock,ballMesh,ballShadow,ball,players=[],controlled;
let score=[0,0],elapsed=0,gameState="menu",stateTimer=0,charging=false,charge=0,lastTime=performance.now();
const keys={};
const touch={x:0,z:0,sprint:false,pointer:null};
const mats={
 grass:material(0x247b37),line:material(0xf1f5ed),skin:material(0xb98059),
 hair:material(0x272027),stand:material(0x131b32),goal:material(0xe9efff,.35,.3)
};

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x050b19);scene.fog=new THREE.Fog(0x050b19,115,230);
 camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,400);
 camera.position.set(0,78,105);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
 $("game").prepend(renderer.domElement);
 clock=new THREE.Clock();
 scene.add(new THREE.HemisphereLight(0xc7ddff,0x18351d,2));
 const light=new THREE.DirectionalLight(0xfff3dc,3);
 light.position.set(-25,65,35);light.castShadow=true;light.shadow.mapSize.set(1024,1024);
 light.shadow.camera.left=-70;light.shadow.camera.right=70;light.shadow.camera.top=70;light.shadow.camera.bottom=-70;scene.add(light);
 const fill=new THREE.DirectionalLight(0x7daaff,1.3);fill.position.set(35,35,-35);scene.add(fill);
 createStadium();createPitch();createGoals();createBall();createTeams();resetPositions();
 setupTouchControls();
 addEventListener("resize",onResize);
 addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  if(!e.repeat){
   keys[e.code]=true;
   if(e.code==="Enter"&&(gameState==="menu"||gameState==="end"))startMatch();
   if(e.code==="Space"&&gameState==="play"){charging=true;charge=0;}
   if(e.code==="KeyF")passBall();
  }
 });
 addEventListener("keyup",e=>{
  keys[e.code]=false;
  if(e.code==="Space"&&charging){charging=false;shootBall();charge=0;}
 });
 $("start").addEventListener("click",()=>{
  if(gameState==="menu"||gameState==="end")startMatch();
  else if(gameState==="goal"){resetPositions(score[0]>score[1]?1:0);gameState="ready";stateTimer=0;hideOverlay();}
 });
 showOverlay("Night Match","3D FIVE-A-SIDE FOOTBALL<br>Joystick: move · Hold SHOOT: kick","KICK OFF");
 requestAnimationFrame(loop);
}

function createStadium(){
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(250,200),material(0x10182a));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
 for(const side of [-1,1]){
  const stand=new THREE.Mesh(new THREE.BoxGeometry(112,12,12),mats.stand);stand.position.set(0,4,side*39);scene.add(stand);
  const end=new THREE.Mesh(new THREE.BoxGeometry(12,12,80),mats.stand);end.position.set(side*57,4,0);scene.add(end);
 }
 const seats=[0x334362,0x253858,0x6a3544,0x53637c];
 for(let r=0;r<4;r++)for(let i=0;i<64;i++){
  const x=-54+i*1.72;
  for(const side of [-1,1]){
   const s=new THREE.Mesh(new THREE.BoxGeometry(1.15,.8,.8),material(seats[(i*7+r*11)%4]));
   s.position.set(x,3+r*2.1,side*(34+r*1.2));scene.add(s);
  }
 }
 for(const x of [-56,56])for(const z of [-34,34]){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.25,.5,24,8),material(0x657087,.4,.6));pole.position.set(x,12,z);scene.add(pole);
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(5,1,1.4),new THREE.MeshBasicMaterial({color:0xfff4d1}));lamp.position.set(x,24,z);scene.add(lamp);
  const l=new THREE.PointLight(0xfff0ce,160,70,2);l.position.set(x,22,z);scene.add(l);
 }
}

function createPitch(){
 const pitch=new THREE.Mesh(new THREE.PlaneGeometry(FIELD_X,FIELD_Z),mats.grass);
 pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;scene.add(pitch);
 for(let i=0;i<10;i++){
  const s=new THREE.Mesh(new THREE.PlaneGeometry(10,FIELD_Z),material(i%2?0x27823b:0x2c8b40));
  s.rotation.x=-Math.PI/2;s.position.set(-45+i*10,.012,0);s.receiveShadow=true;scene.add(s);
 }
 function line(x1,z1,x2,z2,w=.12){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,.035,w),mats.line);
  m.position.set((x1+x2)/2,.045,(z1+z2)/2);m.rotation.y=-Math.atan2(dz,dx);scene.add(m);
 }
 line(-50,-30,50,-30);line(-50,30,50,30);line(-50,-30,-50,30);line(50,-30,50,30);line(0,-30,0,30);
 const circle=new THREE.Mesh(new THREE.TorusGeometry(8,.09,5,80),mats.line);circle.rotation.x=Math.PI/2;circle.position.y=.07;scene.add(circle);
 const spot=new THREE.Mesh(new THREE.CircleGeometry(.22,20),mats.line);spot.rotation.x=-Math.PI/2;spot.position.y=.08;scene.add(spot);
 for(const side of [-1,1]){
  const x=side*50;
  line(x,-17,x-side*16,-17);line(x-side*16,-17,x-side*16,17);line(x-side*16,17,x,17);
  line(x,-9,x-side*6,-9);line(x-side*6,-9,x-side*6,9);line(x-side*6,9,x,9);
 }
}

function createGoals(){
 for(const side of [-1,1]){
  const g=new THREE.Group();
  function bar(w,h,d,x,y,z){
   const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats.goal);m.position.set(x,y,z);m.castShadow=true;g.add(m);
  }
  bar(.35,5,.35,0,2.5,-GOAL_HALF);bar(.35,5,.35,0,2.5,GOAL_HALF);
  bar(.35,.35,GOAL_HALF*2,0,5,0);
  for(const zs of [-1,1])bar(4,.12,.12,side*2,.2,zs*GOAL_HALF);
  bar(.12,5,GOAL_HALF*2,side*4,2.5,0);
  const net=new THREE.LineBasicMaterial({color:0xdbe7ff,transparent:true,opacity:.4});
  for(let z=-GOAL_HALF;z<=GOAL_HALF;z+=1.5){
   const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.2,z),new THREE.Vector3(side*4,.2,z),new THREE.Vector3(side*4,5,z)]);
   g.add(new THREE.Line(geo,net));
  }
  g.position.x=side*50;scene.add(g);
 }
}

function createPlayer(team,index){
 const kit=TEAMS[team],root=new THREE.Group(),jersey=material(index===0?kit.keeper:kit.color);
 const shorts=material(kit.shorts),bootMat=material(0x12151b),sock=material(0xffffff);
 const limbs=[];
 function capsule(rad,len,mat,x,y,z,parent=root){
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(rad,len,4,8),mat);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
 }
 const shortsMesh=new THREE.Mesh(new THREE.BoxGeometry(1.05,.48,.66),shorts);shortsMesh.position.y=1.08;root.add(shortsMesh);
 capsule(.48,.65,jersey,0,1.85,0);
 if(index!==0){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.11,1.15,.85),material(0xffffff));stripe.position.set(0,1.83,0);root.add(stripe);}
 capsule(.17,.15,mats.skin,0,2.43,0);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mats.skin);head.position.y=2.78;root.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.345,16,8,0,Math.PI*2,0,1.2),mats.hair);hair.position.y=2.88;root.add(hair);
 for(const side of [-1,1]){
  const armPivot=new THREE.Group();armPivot.position.set(side*.53,2.13,0);root.add(armPivot);
  capsule(.13,.62,jersey,0,-.38,0,armPivot);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),mats.skin);hand.position.y=-.79;armPivot.add(hand);
  const legPivot=new THREE.Group();legPivot.position.set(side*.28,1,0);root.add(legPivot);
  capsule(.17,.55,sock,0,-.36,0,legPivot);
  const boot=new THREE.Mesh(new THREE.BoxGeometry(.34,.17,.55),bootMat);boot.position.set(0,-.72,.13);legPivot.add(boot);
  limbs.push({armPivot,legPivot,side});
 }
 const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.2,20),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3,depthWrite:false}));
 shadow.rotation.x=-Math.PI/2;shadow.position.y=.025;root.add(shadow);
 scene.add(root);
 return {team,index,root,limbs,shadow,x:0,z:0,vx:0,vz:0,fx:team===0?1:-1,fz:0,speed:index===0?12:14,keeper:index===0,think:0,phase:Math.random()*6,homeX:0,homeZ:0,isChaser:false};
}

function createBall(){
 ballMesh=new THREE.Group();
 const sphere=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,24,18),material(0xf5f5f5,.38));sphere.castShadow=true;ballMesh.add(sphere);
 const black=material(0x151b28,.6);
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const panel=new THREE.Mesh(new THREE.CircleGeometry(.19,5),black);
  panel.position.set(Math.cos(a)*.3,Math.sin(a)*.3,.56);ballMesh.add(panel);
 }
 scene.add(ballMesh);
 ballShadow=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3,depthWrite:false}));
 ballShadow.rotation.x=-Math.PI/2;ballShadow.position.y=.03;scene.add(ballShadow);
 ball={x:0,z:0,y:BALL_R,vx:0,vz:0,vy:0,spin:0,owner:null,lastTeam:0};
}
function createTeams(){
 players=[];
 for(let t=0;t<2;t++)for(let i=0;i<5;i++)players.push(createPlayer(t,i));
 controlled=players.find(p=>p.team===0&&p.index===4);
}
function resetPositions(){
 for(const p of players){
  const f=FORMATION[p.index];p.x=p.team===0?f[0]:-f[0];p.z=f[1];p.vx=p.vz=0;p.think=0;
  p.homeX=p.x;p.homeZ=p.z;
 }
 ball.x=ball.z=ball.vx=ball.vz=ball.vy=0;ball.y=BALL_R;ball.owner=null;
 const k=players.find(p=>p.team===0&&p.index===4);k.x=-2;k.z=0;
 updateTransforms();
}
function updateTransforms(){
 for(const p of players)p.root.position.set(p.x,0,p.z);
 ballMesh.position.set(ball.x,ball.y,ball.z);ballShadow.position.set(ball.x,.03,ball.z);
}
function showOverlay(title,desc,button){$("title").textContent=title;$("description").innerHTML=desc;$("start").textContent=button;$("overlay").classList.remove("hidden");}
function hideOverlay(){$("overlay").classList.add("hidden");}
function updateHUD(){
 $("scoreA").textContent=score[0];$("scoreB").textContent=score[1];
 const s=Math.floor(Math.min(elapsed,MATCH_SECONDS)/MATCH_SECONDS*90);
 $("clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function startMatch(){score=[0,0];elapsed=0;charging=false;charge=0;resetPositions();gameState="ready";stateTimer=0;hideOverlay();updateHUD();}

function setupTouchControls(){
 const joy=$("joystick"),knob=$("joystickKnob"),shoot=$("shootButton"),pass=$("passButton"),sprint=$("sprintButton");
 function resetJoy(){touch.x=touch.z=0;touch.pointer=null;knob.style.transform="translate(-50%,-50%)";}
 function moveJoy(e){
  if(touch.pointer!==e.pointerId)return;
  const r=joy.getBoundingClientRect(),dx0=e.clientX-(r.left+r.width/2),dy0=e.clientY-(r.top+r.height/2),max=r.width*.32,d=Math.hypot(dx0,dy0);
  const dx=d>max?dx0/d*max:dx0,dy=d>max?dy0/d*max:dy0;
  touch.x=dx/max;touch.z=dy/max;
  knob.style.left="50%";knob.style.top="50%";
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
 }
 joy.addEventListener("pointerdown",e=>{e.preventDefault();if(touch.pointer!==null)return;touch.pointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);});
 joy.addEventListener("pointermove",moveJoy);
 joy.addEventListener("pointerup",resetJoy);joy.addEventListener("pointercancel",resetJoy);
 shoot.addEventListener("pointerdown",e=>{
  e.preventDefault();if(gameState!=="play"||charging)return;
  shoot.setPointerCapture(e.pointerId);charging=true;charge=0;shoot.classList.add("pressed");
 });
 function releaseShot(){if(!charging)return;charging=false;shoot.classList.remove("pressed");if(gameState==="play")shootBall();charge=0;}
 shoot.addEventListener("pointerup",releaseShot);shoot.addEventListener("pointercancel",releaseShot);shoot.addEventListener("lostpointercapture",releaseShot);
 pass.addEventListener("pointerdown",e=>{e.preventDefault();pass.classList.add("pressed");passBall();});
 pass.addEventListener("pointerup",()=>pass.classList.remove("pressed"));pass.addEventListener("pointercancel",()=>pass.classList.remove("pressed"));
 sprint.addEventListener("pointerdown",e=>{e.preventDefault();sprint.setPointerCapture(e.pointerId);touch.sprint=true;sprint.classList.add("pressed");});
 function stopSprint(){touch.sprint=false;sprint.classList.remove("pressed");}
 sprint.addEventListener("pointerup",stopSprint);sprint.addEventListener("pointercancel",stopSprint);sprint.addEventListener("lostpointercapture",stopSprint);
}

function chooseControlledPlayer(){
 let best=null,distance=Infinity;
 for(const p of players)if(p.team===0&&!p.keeper){
  const d=Math.hypot(p.x-ball.x,p.z-ball.z);if(d<distance){distance=d;best=p;}
 }
 if(best)controlled=best;
}
function moveHuman(p,dt){
 let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+touch.x;
 let iz=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+touch.z;
 const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag;}
 const speed=(keys.ShiftLeft||keys.ShiftRight||touch.sprint)?19:14;
 const blend=Math.min(1,dt*10);
 p.vx+=(ix*speed-p.vx)*blend;p.vz+=(iz*speed-p.vz)*blend;
 if(Math.hypot(ix,iz)>.12){const m=Math.hypot(ix,iz);p.fx=ix/m;p.fz=iz/m;}
 if(charging)charge=Math.min(1,charge+dt/1.1);
}
function moveAI(p,dt){
 const dir=p.team===0?1:-1,own=ball.owner&&ball.owner.team===p.team;
 let tx=p.homeX,tz=p.homeZ,speed=p.speed;
 if(p.keeper){tx=p.team===0?-46:46;tz=clamp(ball.z*.65,-6,6);}
 else if(p.isChaser&&!own){tx=ball.x;tz=ball.z;speed*=1.1;}
 else{tx+=clamp(ball.x*.22,-10,10);tz+=clamp(ball.z*.28,-9,9);if(own)tx+=dir*9;}
 if(ball.owner===p){
  p.think+=dt;const goal=p.team===0?50:-50;
  tx=p.x+dir*10;tz=p.z*.65;
  if(Math.abs(goal-p.x)<29&&p.think>.7){aiShoot(p);p.think=0;}
  else if(p.think>1.5){aiPass(p);p.think=0;}
 }
 const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz)||1,b=Math.min(1,dt*4);
 p.vx+=(dx/d*speed-p.vx)*b;p.vz+=(dz/d*speed-p.vz)*b;
 if(d>1){p.fx=dx/d;p.fz=dz/d;}
}
function shootBall(){
 if(gameState!=="play"||!controlled)return;
 const p=controlled;if(Math.hypot(ball.x-p.x,ball.z-p.z)>4.3)return;
 let dx=p.fx,dz=p.fz,m=Math.hypot(dx,dz)||1;
 const gx=(p.team===0?50:-50)-ball.x,gz=clamp(ball.z,-6,6)-ball.z,gl=Math.hypot(gx,gz)||1;
 if(dx*gx/gl+dz*gz/gl>.1){dx=dx*.55+gx/gl*.45;dz=dz*.55+gz/gl*.45;}
 m=Math.hypot(dx,dz)||1;const power=19+charge*24;
 ball.x=p.x+dx/m*1.8;ball.z=p.z+dz/m*1.8;ball.vx=dx/m*power;ball.vz=dz/m*power;ball.vy=2+charge*4;ball.owner=null;ball.lastTeam=p.team;
}
function passBall(){
 if(gameState!=="play"||!controlled)return;
 const p=controlled;if(Math.hypot(ball.x-p.x,ball.z-p.z)>4.3)return;
 let best=null,bestScore=-Infinity;
 for(const m of players)if(m.team===0&&m!==p&&!m.keeper){
  const dx=m.x-p.x,dz=m.z-p.z,d=Math.hypot(dx,dz)||1,dot=(dx*p.fx+dz*p.fz)/d;
  if(dot<-.2)continue;const s=dot*15-d*.12;if(s>bestScore){best=m;bestScore=s;}
 }
 if(best){const dx=best.x-ball.x,dz=best.z-ball.z,d=Math.hypot(dx,dz)||1;ball.vx=dx/d*15;ball.vz=dz/d*15;}
 else{ball.vx=p.fx*13;ball.vz=p.fz*13;}
 ball.vy=.8;ball.owner=null;ball.lastTeam=p.team;
}
function aiShoot(p){
 const gx=(p.team===0?50:-50)-ball.x,gz=(Math.random()-.5)*8-ball.z,d=Math.hypot(gx,gz)||1;
 ball.vx=gx/d*27;ball.vz=gz/d*27;ball.vy=2.8;ball.owner=null;ball.lastTeam=p.team;
}
function aiPass(p){
 const candidates=players.filter(m=>m.team===p.team&&m!==p&&!m.keeper);
 candidates.sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z));
 const m=candidates.find(m=>Math.hypot(m.x-p.x,m.z-p.z)>4);
 if(m){const dx=m.x-ball.x,dz=m.z-ball.z,d=Math.hypot(dx,dz)||1;ball.vx=dx/d*17;ball.vz=dz/d*17;ball.owner=null;}
}
function scoreGoal(team){
 if(gameState!=="play")return;
 score[team]++;gameState="goal";stateTimer=0;ball.owner=null;ball.vx=ball.vz=0;updateHUD();
 showOverlay("GOAL!",`${TEAMS[0].name} ${score[0]} - ${score[1]} ${TEAMS[1].name}`,"CONTINUE");
}
function updateBall(dt){
 if(ball.owner){
  const p=ball.owner;
  ball.x=p.x+p.fx*1.35;ball.z=p.z+p.fz*1.35;ball.y=BALL_R;
  ball.vx=p.vx;ball.vz=p.vz;
 }else{
  ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.y+=ball.vy*dt;ball.vy-=14*dt;
  if(ball.y<BALL_R){ball.y=BALL_R;ball.vy=Math.abs(ball.vy)*.42;if(Math.abs(ball.vy)<1)ball.vy=0;}
  const friction=Math.exp(-1.15*dt);ball.vx*=friction;ball.vz*=friction;
 }
 ball.spin+=Math.hypot(ball.vx,ball.vz)*dt;
 if(Math.abs(ball.z)>HALF_Z-BALL_R){ball.z=Math.sign(ball.z)*(HALF_Z-BALL_R);ball.vz*=-.65;}
 if(ball.x>HALF_X&&Math.abs(ball.z)<GOAL_HALF&&ball.y<5){scoreGoal(0);return;}
 if(ball.x< -HALF_X&&Math.abs(ball.z)<GOAL_HALF&&ball.y<5){scoreGoal(1);return;}
 if(Math.abs(ball.x)>HALF_X-BALL_R&&(Math.abs(ball.z)>GOAL_HALF||ball.y>5)){ball.x=Math.sign(ball.x)*(HALF_X-BALL_R);ball.vx*=-.65;}
 for(const p of players){
  const dx=ball.x-p.x,dz=ball.z-p.z,d=Math.hypot(dx,dz);
  if(d>PLAYER_R+BALL_R+.3)continue;
  if(p.keeper&&ball.y<3.5){ball.vx=(p.team===0?1:-1)*17;ball.vz=(Math.random()-.5)*14;ball.vy=2;ball.owner=null;continue;}
  if(ball.owner&&ball.owner.team!==p.team)continue;
  if(Math.hypot(ball.vx,ball.vz)>21){ball.vx*=.72;ball.vz*=.72;continue;}
  if(!ball.owner||ball.owner===p||ball.owner.team===p.team){
   ball.x=p.x+dx/(d||1)*(PLAYER_R+BALL_R);ball.z=p.z+dz/(d||1)*(PLAYER_R+BALL_R);
   ball.vx=p.vx*.9;ball.vz=p.vz*.9;ball.owner=p;ball.lastTeam=p.team;
  }
 }
 ballMesh.position.set(ball.x,ball.y,ball.z);ballMesh.rotation.set(ball.spin*.3,0,ball.spin*.45);
 ballShadow.position.set(ball.x,.035,ball.z);
 const scale=clamp(1.2-(ball.y-BALL_R)*.08,.45,1.2);ballShadow.scale.setScalar(scale);
 ballShadow.material.opacity=clamp(.32-(ball.y-BALL_R)*.04,.08,.32);
}
function updatePlayers(dt){
 chooseControlledPlayer();
 for(const t of [0,1]){
  let closest=null,distance=Infinity;
  for(const p of players){p.isChaser=false;if(p.team!==t||p.keeper)continue;const d=Math.hypot(p.x-ball.x,p.z-ball.z);if(d<distance){distance=d;closest=p;}}
  if(closest)closest.isChaser=true;
 }
 for(const p of players){
  if(p===controlled)moveHuman(p,dt);else moveAI(p,dt);
  p.x+=p.vx*dt;p.z+=p.vz*dt;p.x=clamp(p.x,-48.5,48.5);p.z=clamp(p.z,-28.5,28.5);
  p.phase+=Math.hypot(p.vx,p.vz)*dt*.8;
  const running=Math.min(1,Math.hypot(p.vx,p.vz)/10);
  for(const l of p.limbs){const swing=Math.sin(p.phase)*.65*running;l.legPivot.rotation.x=l.side*swing;l.armPivot.rotation.x=-l.side*swing*.8;}
  p.root.position.set(p.x,0,p.z);
  if(Math.hypot(p.vx,p.vz)>.4)p.root.rotation.y=Math.atan2(p.vx,p.vz);
  p.shadow.material.opacity=p===controlled?.5:.25;p.shadow.scale.setScalar(p===controlled?1.25:1);
 }
 for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
  const a=players[i],b=players[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
  if(d>0&&d<PLAYER_R*1.5){const overlap=(PLAYER_R*1.5-d)*.5;a.x-=dx/d*overlap;a.z-=dz/d*overlap;b.x+=dx/d*overlap;b.z+=dz/d*overlap;}
 }
}
function updateCamera(dt){
 const tx=controlled?controlled.x*.16:0,tz=controlled?controlled.z*.1:0;
 camera.position.x+=(tx-camera.position.x)*Math.min(1,dt);
 camera.position.z+=(105-camera.position.z)*Math.min(1,dt*.5);
 camera.lookAt(tx,0,tz);
}
function finishMatch(){
 gameState="end";charging=false;
 const result=score[0]>score[1]?"BLUE FC WINS!":score[1]>score[0]?"RED FC WINS!":"FULL TIME - DRAW";
 showOverlay(result,`FINAL SCORE<br>BLUE FC ${score[0]} - ${score[1]} RED FC`,"PLAY AGAIN");
}
function update(dt){
 if(gameState==="menu"||gameState==="end")return;
 stateTimer+=dt;
 if(gameState==="ready"){if(stateTimer>1.2){gameState="play";stateTimer=0;hideOverlay();}return;}
 if(gameState==="goal"){if(stateTimer>2){if(elapsed>=MATCH_SECONDS)finishMatch();else{resetPositions();gameState="ready";stateTimer=0;hideOverlay();}}return;}
 elapsed+=dt;
 if(elapsed>=MATCH_SECONDS){elapsed=MATCH_SECONDS;updateHUD();finishMatch();return;}
 updatePlayers(dt);updateBall(dt);updateHUD();updateCamera(dt);
}
function onResize(){
 camera.aspect=innerWidth/innerHeight;
 // A wider view helps show more of the pitch on a portrait phone.
 camera.fov=innerWidth<innerHeight?55:43;
 camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
}
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min((now-lastTime)/1000,.033);lastTime=now;
 update(dt);renderer.render(scene,camera);
}
init();
onResize();
</script>
</body>
